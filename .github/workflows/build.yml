name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Blitz and Stylo, full LTO.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffrwd
        run: pip install ffrwd ffrwd-wasm
      - name: Build the module
        run: cargo build --target wasm32-wasip2 --release
      - name: Describe the module and its shapes
        run: |
          module=target/wasm32-wasip2/release/compose.wasm
          ffrwd-wasm --describe "$module"
          ffrwd-wasm --shape "$module" --bound v,inputs,changes
          ffrwd-wasm --shape "$module" --params '{"width":1280,"height":720}'
      - name: Unit tests
        run: cargo test -p blitz-compose-core -p compose
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --target wasm32-wasip2 --release --all-targets -- -D warnings
