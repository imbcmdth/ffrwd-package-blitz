[package]
name = "compose"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "compose"
crate-type = ["cdylib", "rlib"]

[dependencies]
blitz-compose-core = { path = "../core" }
ffrwd-node.workspace = true
ffrwd-frame.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true

# wgpu over wasi:webgpu, the GPU the sidecar hosts. A repository of its own,
# pinned by tag, as the owner's other crates are.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu-wasi-webgpu = { git = "https://github.com/imbcmdth/wgpu-wasi-webgpu", tag = "v29.0.0" }
# The `ffrwd:gpu` bindings (wit/), whose `wasi:webgpu` is the backend's.
wit-bindgen = "0.57.1"

# tests/sidecar.rs: the pictures handed to the sidecar and the frames read
# back, as NUT.
[dev-dependencies]
ffrwd-nut = { git = "https://github.com/imbcmdth/ffrwd-nut", tag = "v0.1.5" }
