[package]
name = "blitz-bench"
description = "The 4K60 compositing experiment, step A: the harness on native wgpu, one JSON row a frame, and the summariser that turns rows into a table"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "summarize"
path = "src/summarize.rs"

[[bin]]
name = "nutframe"
path = "src/nutframe.rs"

[dependencies]
blitz-bench-doc = { path = "doc" }
blitz-bench-harness = { path = "harness" }
wgpu = { version = "29", default-features = false, features = ["wgsl", "dx12", "metal", "vulkan", "gles"] }
serde_json.workspace = true
image.workspace = true
# For pulling the wasm run's picture out of a NUT file.
ffrwd-nut = { git = "https://github.com/imbcmdth/ffrwd-nut", tag = "v0.1.5" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
