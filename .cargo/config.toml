# wasm32-wasip2 leaves SIMD off by default; vello_cpu (fearless_simd) uses it.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]

# The wit comes from the installed ffrwd/wasm package: the module's build.rs
# asks `ffrwd path ffrwd/wasm` for it, so run `ffrwd install` once before
# building.
